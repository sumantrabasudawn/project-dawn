name: Dawn Collect (2-hour)

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Debug paths + run collector
        run: |
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "PWD=$(pwd)"
          echo "Listing repo root:"
          ls -la
          echo "Listing connectors:"
          ls -la connectors || true
          echo "Find runner.py:"
          find . -maxdepth 4 -name "runner.py" -print
          echo "Run via workspace absolute path:"
          python "$GITHUB_WORKSPACE/connectors/runner.py"

      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: dawn-output
          path: state/out/
          if-no-files-found: warn
